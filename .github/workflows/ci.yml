name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Type-check & Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expenses_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check shared
        run: pnpm --filter shared exec tsc --noEmit

      - name: Type-check backend
        run: pnpm --filter backend exec tsc --noEmit

      - name: Type-check frontend
        run: pnpm --filter frontend exec tsc --noEmit

      - name: Test backend
        run: pnpm --filter backend test

      - name: Test frontend
        run: pnpm --filter frontend test
